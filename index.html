<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de ideias e melhorias da Hubvision: sugira, vote e acompanhe a evolução dos projetos." />
    <title>Hubvision Ideias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins nos títulos (formas arredondadas, aproxima o leitor); Lato no texto corrido (leitura sem fadiga). -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema antes da renderização para evitar piscar.
      // Escuro é o padrão; o claro só vale se a pessoa escolheu (fica salvo).
      var t = null;
      try {
        t = localStorage.getItem('hv-theme');
      } catch (e) {}
      if (t !== 'light') document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
